name: DeLorean Cloud bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK-Lizenzen bestätigen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: APK bauen
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk DeLoreanCloud-32bit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DeLoreanCloud-32bit
          path: DeLoreanCloud-32bit.apk

      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: DeLorean Cloud Build ${{ github.run_number }}
          body: |
            DeLorean Cloud – Xbox Cloud Gaming mit Cover-Liste, Direktstart und Touch-Steuerung.
            DeLoreanCloud-32bit.apk läuft auf 32-bit- und 64-bit-Geräten (ab Android 5.0).
            Created by DeLorean23
          files: DeLoreanCloud-32bit.apk
          make_latest: true

      - name: Fehlerprotokoll speichern
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          tail -c 60000 build-log.txt > /tmp/log.txt || echo "kein Log" > /tmp/log.txt
          git fetch origin build-logs || true
          git checkout -B build-logs
          git rm -rq --cached . || true
          cp /tmp/log.txt build-log.txt
          git add -f build-log.txt
          git commit -m "Build-Log Cloud ${{ github.run_number }}"
          git push -f origin build-logs
