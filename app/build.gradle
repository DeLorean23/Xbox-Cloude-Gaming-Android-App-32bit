plugins {
    id 'com.android.application'
}

android {
    namespace 'de.delorean23.cloud'
    compileSdk 35

    defaultConfig {
        applicationId 'de.delorean23.cloud'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Fester Schlüssel, damit Updates über die alte Version installiert werden können
    signingConfigs {
        fest {
            storeFile file('signing.jks')
            storePassword 'delorean23'
            keyAlias 'delorean23'
            keyPassword 'delorean23'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fest
        }
        debug {
            signingConfig signingConfigs.fest
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
